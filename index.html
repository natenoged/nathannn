  <script>
    // Marks that JS is available (gates the status-row hold in styles.css) and
    // starts the statuses fetch during head parse, so it is usually resolved
    // before first paint instead of arriving a beat after the date.
    document.documentElement.classList.add('js');
    window.__statuses = fetch('/statuses.md').then(r => r.text()).catch(() => '');
  </script>

  <span class="status-dot" aria-hidden="true"></span>
  <div class="status-text">
    <span id="date"></span> <span id="status-label"></span>
  </div>
</div>

<script>
  (() => {
    const row = document.querySelector('.status');
    document.getElementById('date').textContent =
      new Date().toLocaleDateString('en-GB', { day: '2-digit', month: '2-digit', year: '2-digit' });

    // reveal the row as one piece, once the label is in place
    const reveal = () => row.classList.add('is-ready');

    (window.__statuses || Promise.resolve('')).then(text => {
      const statuses = text.split('\n').map(s => s.trim()).filter(Boolean);
      if (statuses.length) {
        const index = parseInt(localStorage.getItem('statusIndex') || '0', 10);
        const label = document.getElementById('status-label');
        label.innerHTML = statuses[index % statuses.length];
        localStorage.setItem('statusIndex', (index + 1) % statuses.length);
        // statuses.md carries bare <a> tags - always send them to a new tab
        label.querySelectorAll('a').forEach(a => {
          a.target = '_blank';
          a.rel = 'noopener noreferrer';
        });
      }
      reveal();
    }).catch(reveal);

    // never leave the row hidden if the fetch hangs
    setTimeout(reveal, 1200);
  })();
</script>

  <script>
  // the mailbox flag flips between the two gifs on click
  (() => {
    const mailbox = document.querySelector('.mailbox-icon');
    if (!mailbox) return;
    const frames = ['/assets/icons/mailbox.gif', '/assets/icons/mailbox2.gif'];
    const flip = () => {
      const next = frames[(frames.indexOf(new URL(mailbox.src).pathname) + 1) % frames.length];
      mailbox.src = next;
    };
    mailbox.addEventListener('click', flip);
    mailbox.addEventListener('keydown', e => {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); flip(); }
    });
  })();

  function toggleVideo(container) {
    const video = container.querySelector('video');
    if (video.paused) {
      video.play();
      container.classList.add('playing');
    } else {
      video.pause();
      container.classList.remove('playing');
    }
  }

  </script>
