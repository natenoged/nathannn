<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nathan's Work</title>
    <!-- the sheet is on the critical path; fonts are same-origin so preload them -->
    <link rel="preconnect" href="https://docs.google.com">
    <link rel="preload" as="font" type="font/woff2" href="/assets/fonts/roboto-variable-latin.woff2" crossorigin>
    <link rel="preload" as="font" type="font/woff2" href="/assets/fonts/roboto-mono-400-latin.woff2" crossorigin>
    <script src="/theme.js"></script>
    <link rel="stylesheet" href="/breadcrumb.css">
    <link rel="stylesheet" href="/styles.css">
    
    
</head> 

<a href="/" class="breadcrumb-link-block">
      <div class="breadcrumb-link-text">nathannn.com</div>
      <div class="breadcrumb-link-arrow">&gt;</div>
      <div class="breadcrumb-link-description">work</div>
    </a>

<body class="work">
    <!--<h1>Portfolio</h1>-->
    <div class="filter-controls" style="visibility: hidden">
        <!-- All buttons will be added dynamically -->
    </div>
    <div class="portfolio-grid" id="portfolioGrid">
        <!-- Portfolio items will be added here dynamically -->
    </div>

    <div id="portfolioModal" class="modal">
        <div class="modal-content">
            <div class="close" tabindex="0" role="button">&lt; work</div>
            <div id="modalHeader">
                <h3 id="modalPortfolioName"></h3>
                <div id="modalPortfolioTags" class="portfolio-tags"></div>
                
            </div>
            
            <div id="modalDescription"></div>
            <div id="modalVideoContainer"></div>
            <div id="modalGalleryContainer" class="modal-gallery"></div>
        </div>
    </div>

    <script>
        // Constants for Google Sheets integration
        const SHEET_ID = '2PACX-1vQg73EGWJtcY7cNZMQPqgWjRkFQCF5s1MKZbpJ2UxEX9cOzov0_08f15U-eirCxca4eGFLbdM_9E8ik';
        const SHEET_URL = `https://docs.google.com/spreadsheets/d/e/${SHEET_ID}/pub?output=csv`;

        // Normalize file paths to use forward slashes for URLs
        function normalizePath(path) {
            if (!path) return '';
            // If it's already a URL, return it as is
            if (path.startsWith('http://') || path.startsWith('https://')) {
                return path;
            }
            // Replace backslashes with forward slashes and ensure proper relative path
            let normalized = path.replace(/\\/g, '/');
            // If the path doesn't start with a slash or dot, make it relative
            if (!normalized.startsWith('/') && !normalized.startsWith('.')) {
                normalized = '../' + normalized;
            }
            return normalized;
        }

        // DOM elements
        const portfolioGrid = document.getElementById('portfolioGrid');
        const filterControls = document.querySelector('.filter-controls');        // Data storage
        let allItems = [];
        const categories = new Set();
        const types = new Set();
        const animatedItems = new Map(); // Track which items have been animated in each filter

        // Sanitize data to prevent XSS attacks
        function sanitizeHTML(str) {
            const temp = document.createElement('div');
            temp.textContent = str;
            return temp.innerHTML;
        }

        // The sheet round trip is ~1.2-1.9s and nothing can render until it lands,
        // so the last response is kept and used to paint immediately on the next
        // visit while a fresh copy is fetched in the background. The grid is only
        // rebuilt if the new CSV actually differs, which is rarely.
        const CACHE_KEY = 'workSheetCSV:v1';
        const COUNT_KEY = 'workItemCount:v1';

        function readCachedCSV() {
            try { return localStorage.getItem(CACHE_KEY); } catch (error) { return null; }
        }

        function writeCachedCSV(csv) {
            try { localStorage.setItem(CACHE_KEY, csv); } catch (error) { /* quota / private mode */ }
        }

        // Fetch portfolio data from Google Sheets
        async function fetchSheetCSV() {
            const response = await fetch(SHEET_URL);
            if (!response.ok) throw new Error('Failed to fetch data');
            return response.text();
        }

        // Parse CSV data into a usable format
        function parseCSV(csvText) {
            const lines = csvText.split('\n');
            const headers = lines[0].split(',').map(header => header.trim().replace(/"/g, ''));
            return lines.slice(1).map(line => {
                const entries = [];
                let currentEntry = '';
                let insideQuotes = false;

                for (let char of line) {
                    if (char === '"') insideQuotes = !insideQuotes;
                    else if (char === ',' && !insideQuotes) {
                        entries.push(currentEntry.trim().replace(/"/g, ''));
                        currentEntry = '';
                    } else currentEntry += char;
                }
                entries.push(currentEntry.trim().replace(/"/g, ''));

                const entry = {};
                headers.forEach((header, index) => {
                    entry[header.toLowerCase()] = entries[index] || '';
                });
                return entry;
            }).filter(item => item.name);
        }

        // renderPortfolio function with lazy loading
        // Placeholder cards for the window between page load and the sheet
        // answering (~1.2s cold), so the grid is never just empty space.
        function renderSkeletons(count) {
            portfolioGrid.innerHTML = '';
            for (let i = 0; i < count; i++) {
                const card = document.createElement('div');
                card.className = 'portfolio-item is-skeleton';
                card.innerHTML =
                    '<div>' +
                        '<div class="thumb-wrap"></div>' +
                        '<div class="portfolio-content">' +
                            '<div class="skeleton-line"></div>' +
                            '<div class="skeleton-line is-short"></div>' +
                        '</div>' +
                    '</div>';
                portfolioGrid.appendChild(card);
            }
        }

        function renderPortfolio(items) {
            portfolioGrid.innerHTML = '';
            filterControls.classList.add('loaded'); // Add this lines
            items.forEach((item, index) => {
                const portfolioItem = document.createElement('div');
                portfolioItem.className = 'portfolio-item';
                portfolioItem.dataset.category = sanitizeHTML(item.category || '');
                portfolioItem.dataset.type = sanitizeHTML(item.type || '');

                const tags = item.tags ? item.tags.split(',').map(tag => sanitizeHTML(tag.trim())) : [];
                const isThumbnailVideo = item['thumbnail url'] && /\.(mp4|webm|ogg)$/.test(item['thumbnail url']);
                const thumbnailUrl = item['thumbnail url'] ? normalizePath(item['thumbnail url']) : 'https://via.placeholder.com/300x200?text=No+Image';
                const thumbnailContent = isThumbnailVideo
                    ? `<div class="thumb-wrap"><video class="thumbnail" src="${sanitizeHTML(thumbnailUrl)}"
                        type="video/webm"
                        preload="metadata">
                        Your browser does not support the video tag.
                       </video></div>`
                    : `<div class="thumb-wrap"><img class="thumbnail" src="${sanitizeHTML(thumbnailUrl)}" alt="" loading="lazy" decoding="async"></div>`;

                portfolioItem.innerHTML = `
                    <div>
                        ${thumbnailContent}
                        <div class="portfolio-content">
                            <div class="portfolio-subtitle">${sanitizeHTML(item.subtitle || '')}</div>
                            <div class="portfolio-bwrap">
                                <h3 class="portfolio-name">${sanitizeHTML(item.name || 'Untitled')}</h3>
                                <div class="portfolio-tags">
                                    ${tags.map(tag => `<span class="tag" data-tag="${sanitizeHTML(tag.toLowerCase())}">${sanitizeHTML(tag)}</span>`).join('')}
                                </div>
                            </div>
                            <div class="portfolio-client">${item.client ? 'Client: ' + sanitizeHTML(item.client) : ''}</div>
                        </div>
                    </div>
                `;                
                portfolioItem.addEventListener('click', () => {
                    if (item['off-site']?.toLowerCase() === 'yes' && item['external project link']) {
                        // Open external link in new tab for off-site items
                        window.open(item['external project link'], '_blank', 'noopener noreferrer');
                    } else {
                        // Open modal for regular items
                        openModal(item['external project link'], item.description, item.name, tags, item.gallery);
                    }
                });

                // Get current filter from URL or default to 'all'
                const currentFilter = window.location.hash.replace(/^#?\/?/, '').toLowerCase() || 'all';
                
                // Check if this item has been animated in this filter
                const itemKey = `${item.name}-${currentFilter}`;
                if (!animatedItems.has(itemKey)) {
                    // capped: a flat index * 100 meant the last of 29 cards waited
                    // 2.8s after the grid had already rendered
                    setTimeout(() => {
                        portfolioItem.classList.add('animate-in'); // Add class to trigger animation
                        portfolioItem.classList.add('hover-ready'); // Add class to enable hover effect
                        animatedItems.set(itemKey, true);
                    }, Math.min(index * 40, 400));
                } else {
                    portfolioItem.classList.add('animate-in', 'hover-ready');
                }

                // Drop the placeholder and fade the image up only once it has fully
                // decoded - decode() rather than load, so it is painted in one go
                // instead of scanning down the frame as bytes arrive.
                const thumbImg = portfolioItem.querySelector('img.thumbnail');
                if (thumbImg) {
                    const wrap = thumbImg.parentElement;
                    const settle = () => {
                        wrap.classList.add('is-loaded');
                        thumbImg.classList.add('is-loaded');
                    };
                    const reveal = () => {
                        if (thumbImg.decode) thumbImg.decode().then(settle, settle);
                        else settle();
                    };
                    if (thumbImg.complete && thumbImg.naturalWidth) reveal();
                    else {
                        thumbImg.addEventListener('load', reveal, { once: true });
                        thumbImg.addEventListener('error', settle, { once: true });
                    }
                }

                portfolioGrid.appendChild(portfolioItem);

                if (item.category) categories.add(item.category);
                if (item.type) types.add(item.type);
            });
        }

        // Open modal with portfolio details, galleryPath
        function openModal(externalLink, description, name, tags, galleryPath) {
            const modal = document.getElementById('portfolioModal');
            const modalVideoContainer = document.getElementById('modalVideoContainer');
            const modalGalleryContainer = document.getElementById('modalGalleryContainer');
            const modalDescription = document.getElementById('modalDescription');
            const modalPortfolioName = document.getElementById('modalPortfolioName');
            const modalPortfolioTags = document.getElementById('modalPortfolioTags');

            function renderGallery(galleryData, projectName) {
                if (!galleryData) {
                    modalGalleryContainer.innerHTML = '';
                    return;
                }

                const supportedExtensions = ['jpg', 'jpeg', 'png', 'webp', 'gif', 'avif'];
                const entries = galleryData
                    .split(',')
                    .map(entry => entry.trim())
                    .filter(Boolean)
                    .map(entry => {
                        const markdownMatch = entry.match(/\(([^)]+)\)$/);
                        if (markdownMatch) entry = markdownMatch[1];
                        entry = entry.replace(/^['"\[\(<]+|['"\]>\)]+$/g, '').trim();
                        return entry;
                    });

                const images = entries
                    .map(entry => {
                        if (!supportedExtensions.some(ext => entry.toLowerCase().endsWith('.' + ext))) return null;
                        let url = entry.replace(/\\/g, '/');
                        if (url.startsWith('http://') || url.startsWith('https://')) return url;
                        if (url.startsWith('/')) return url;
                        if (url.startsWith('assets/')) return '/' + url;
                        return `/assets/galleries/${url}`;
                    })
                    .filter(Boolean);

                if (images.length > 0) {
                    modalGalleryContainer.innerHTML = `
                        <div class="modal-gallery-items">
                            ${images.map(src => {
                                const fileName = src.split('/').pop() || 'Image';
                                return `<div class="modal-gallery-item">
                                            <a href="${sanitizeHTML(src)}" target="_blank" rel="noopener noreferrer">
                                                <img src="${sanitizeHTML(src)}" alt="${sanitizeHTML(projectName)}">
                                            </a>
                                            <div class="modal-gallery-caption">${sanitizeHTML(fileName)}</div>
                                        </div>`;
                            }).join('')}
                        </div>
                    `;
                } else {
                    modalGalleryContainer.innerHTML = '<div class="modal-gallery-empty">No gallery preview available.</div>';
                }
            }

            const projectSlug = name.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
            history.replaceState(null, '', `/work/#${projectSlug}`);  // ✅ CHANGED pushState to replaceState

            const closeButton = modal.querySelector('.close');
            const focusableElements = 'button, [href], input, select, textarea, [tabindex]:not([tabindex="-1"])';
            let previouslyFocusedElement = document.activeElement;

            modalPortfolioName.textContent = name || 'Untitled';
            modalPortfolioTags.innerHTML = tags.map(tag => `<span class="tag" data-tag="${tag.toLowerCase()}">${tag}</span>`).join('');

            const normalizedGalleryPath = galleryPath ? galleryPath.trim() : '';
            const externalLinks = externalLink
                ? externalLink.split(',').map(link => link.trim()).filter(Boolean)
                : [];
            renderGallery(normalizedGalleryPath, name);

            if (externalLinks.length > 0) {
                const embedSections = externalLinks.map((link) => {
                    const normalizedLink = normalizePath(link);

                    if (normalizedLink.match(/\.(jpg|jpeg|png|gif)$/i)) {
                        return `<img src="${sanitizeHTML(normalizedLink)}" alt="${sanitizeHTML(name)}">`;
                    }

                    if (normalizedLink.match(/\.(webm|mp4|ogg)$/i)) {
                        return `<video src="${sanitizeHTML(normalizedLink)}" autoplay muted loop playsinline controls></video>`;
                    }

                    if (normalizedLink.includes('youtube.com') || normalizedLink.includes('youtu.be')) {
                        let embedUrl = '';
                        if (normalizedLink.includes('youtube.com')) {
                            const urlParams = new URL(normalizedLink).searchParams;
                            const videoId = urlParams.get('v');
                            const playlistId = urlParams.get('list');
                            embedUrl = playlistId
                                ? `https://www.youtube.com/embed/videoseries?list=${playlistId}`
                                : videoId
                                    ? `https://www.youtube.com/embed/${videoId}`
                                    : '';
                        } else if (normalizedLink.includes('youtu.be')) {
                            const videoId = normalizedLink.split('/').pop();
                            embedUrl = `https://www.youtube.com/embed/${videoId}`;
                        }
                        return embedUrl
                            ? `<iframe src="${sanitizeHTML(embedUrl)}" frameborder="0" allowfullscreen></iframe>`
                            : '<p>No video</p>';
                    }

                    if (normalizedLink.includes('soundcloud.com')) {
                        const soundCloudUrl = encodeURIComponent(normalizedLink);
                        return `<iframe 
                            width="100%" 
                            height="166" 
                            scrolling="no" 
                            frameborder="no" 
                            src="https://w.soundcloud.com/player/?url=${soundCloudUrl}&color=%23ff5500&auto_play=false&hide_related=true&show_comments=false&show_user=true&show_reposts=false&show_teaser=false"
                        ></iframe>`;
                    }

                    return `<p>Unsupported content type: ${sanitizeHTML(normalizedLink)}</p>`;
                });

                modalVideoContainer.innerHTML = embedSections.join('');
            } else {
                modalVideoContainer.innerHTML = '<p></p>';
            }

            modalDescription.innerHTML = description || '<p>No description</p>';
            modal.style.display = 'block';

            // Compute focusable elements after all modal content has been populated
            const focusableContent = modal.querySelectorAll(focusableElements);
            const firstFocusableElement = focusableContent[0];
            const lastFocusableElement = focusableContent[focusableContent.length - 1];

            // Trap focus within the modal
            function trapFocus(event) {
                if (event.key === 'Tab') {
                    if (event.shiftKey) { // Shift + Tab
                        if (document.activeElement === firstFocusableElement) {
                            event.preventDefault();
                            lastFocusableElement.focus();
                        }
                    } else { // Tab
                        if (document.activeElement === lastFocusableElement) {
                            event.preventDefault();
                            firstFocusableElement.focus();
                        }
                    }
                }
            }

            // Close modal with ESC key
            function handleKeydown(event) {
                if (event.key === 'Escape') {
                    closeModal();
                } else {
                    trapFocus(event);
                }
            }

            // Close modal and restore focus
            function closeModal() {

                // Check if there was an active filter before the modal opened
                const filterButtons = document.querySelectorAll('.filter-btn');
                const activeFilter = Array.from(filterButtons).find(btn => btn.classList.contains('active'));
                const activeFilterValue = activeFilter?.dataset.filter || 'all';
                
                // Return to the filter view that was active
                if (activeFilterValue === 'all') {
                    history.replaceState(null, '', '/work');  // ✅ Also fix this to replaceState
                } else {
                    history.replaceState(null, '', `/work/#${activeFilterValue}`);  // ✅ And this
                }
                modal.style.display = 'none';
                modalVideoContainer.innerHTML = '';
                modalGalleryContainer.innerHTML = '';
                modalDescription.innerHTML = '';
                document.removeEventListener('keydown', handleKeydown);
                window.removeEventListener('click', modalBackdropClick);  // ✅ CLEANUP ADDED
                previouslyFocusedElement.focus();
            }
                closeButton.onclick = closeModal;

                            // Store reference so we can remove it later
                            const modalBackdropClick = (event) => {
                                if (event.target === modal) {
                                    closeModal();
                                }
                            };
                            
                            window.addEventListener('click', modalBackdropClick);  // ✅ Use addEventListener

                            document.addEventListener('keydown', handleKeydown);

        }

        // Create filter buttons dynamically based on tags
        function createFilterButtons() {
            const tagsSet = new Set(['all']); // Add 'all' as the first filter

            // Collect all unique tags from the portfolio items
            allItems.forEach(item => {
                if (item.tags) {
                    item.tags.split(',').forEach(tag => {
                        tagsSet.add(tag.trim());
                    });
                }
            });

            // Clear existing buttons
            filterControls.innerHTML = '';

            // Create buttons for all filters, including 'all'
            Array.from(tagsSet).forEach(tag => {
                const button = document.createElement('button');
                button.className = 'filter-btn';
                button.dataset.filter = tag.toLowerCase();
                button.textContent = tag === 'all' ? 'All' : tag;
                if (tag === 'all') button.classList.add('active');
                filterControls.appendChild(button);
            });

            // Add event listeners to filter buttons
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.addEventListener('click', function(e) {
                    const filter = this.dataset.filter;
                    
                    // Update URL - use pushState for browser history
                    if (filter === 'all') {
                        history.pushState(null, '', '/work');
                    } else {
                        history.pushState(null, '', `/work/#${filter}`);
                    }

                    // Update active state and filter items
                    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                    this.classList.add('active');

                    if (filter === 'all') {
                        renderPortfolio(allItems);
                    } else {
                        const filteredItems = allItems.filter(item =>
                            item.tags && item.tags.split(',').map(tag => tag.trim().toLowerCase()).includes(filter)
                        );
                        renderPortfolio(filteredItems);
                    }
                });
            });

            // Show the filter controls once everything is ready
            filterControls.style.visibility = 'visible';
        }



        
        // Build the filters and paint whatever the current URL asks for.
        function applyCurrentView({ openDeepLink }) {
            createFilterButtons();

            const hash = window.location.hash.replace(/^#?\/?/, '').toLowerCase();
            const targetButton = hash && document.querySelector(`[data-filter="${hash}"]`);

            if (targetButton) {
                // render the filter directly - clicking would push another history entry
                document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                targetButton.classList.add('active');
                renderPortfolio(allItems.filter(item =>
                    item.tags && item.tags.split(',').map(tag => tag.trim().toLowerCase()).includes(hash)
                ));
                return;
            }

            renderPortfolio(allItems);

            if (hash && openDeepLink) {
                const matchingItem = findItemBySlug(hash);
                if (matchingItem) openModalForItem(matchingItem);
            }
        }

        // Initialize portfolio
        async function initPortfolio() {
            const cached = readCachedCSV();

            if (cached) {
                allItems = parseCSV(cached);
                applyCurrentView({ openDeepLink: true });
            } else {
                // first visit: no data yet, so stand in placeholders at roughly the
                // count we saw last time (12 is a reasonable cold guess)
                let guess = 12;
                try { guess = parseInt(localStorage.getItem(COUNT_KEY), 10) || 12; } catch (error) {}
                renderSkeletons(Math.min(guess, 24));
            }

            try {
                const fresh = await fetchSheetCSV();
                writeCachedCSV(fresh);

                if (fresh === cached) return; // nothing changed, leave the page alone

                allItems = parseCSV(fresh);
                try { localStorage.setItem(COUNT_KEY, String(allItems.length)); } catch (error) {}
                // don't yank the grid out from under an open modal
                const modalOpen = document.getElementById('portfolioModal').style.display === 'block';
                if (!modalOpen) applyCurrentView({ openDeepLink: !cached });
            } catch (error) {
                console.error('Failed to initialize portfolio:', error);
                if (!cached) {
                    portfolioGrid.innerHTML = '<p>Error loading portfolio data. Please try again later.</p>';
                }
            }
        }

        // Find a portfolio item whose slugified name matches the given hash
        function findItemBySlug(slug) {
            return allItems.find(item => {
                const itemSlug = item.name.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
                return itemSlug === slug;
            });
        }

        // Open the modal for a given portfolio item
        function openModalForItem(item) {
            const tags = item.tags ? item.tags.split(',').map(tag => tag.trim()) : [];
            openModal(item['external project link'], item.description, item.name, tags, item.gallery);
        }

        // Handle URL hash changes
        function handleHashChange() {
            const hash = window.location.hash.replace(/^#?\/?/, '').toLowerCase();

            // Check if it's a filter or a project
            const filterButton = document.querySelector(`[data-filter="${hash}"]`);

            if (filterButton) {
                // It's a filter - click the button
                if (!filterButton.classList.contains('active')) {
                    filterButton.click();
                }
            } else if (hash) {
                // It's a project slug - find and open the modal
                const matchingItem = findItemBySlug(hash);

                if (matchingItem) {
                    // Temporarily remove pushState from openModal to avoid double-pushing
                    const originalHash = window.location.hash;
                    openModalForItem(matchingItem);
                    // Restore hash if openModal changed it
                    if (window.location.hash !== originalHash) {
                        history.replaceState(null, '', originalHash);
                    }
                } else {
                    // Invalid hash - go to all
                    const allButton = document.querySelector('[data-filter="all"]');
                    allButton?.click();
                }
            } else {
                // No hash - show all
                const allButton = document.querySelector('[data-filter="all"]');
                allButton?.click();
            }
        }

        // Add event listeners before initializing
        window.addEventListener('hashchange', handleHashChange);
        initPortfolio();
    </script>
</body>
</html>
